<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OnIt</title>
<meta name="theme-color" content="#F3EAFE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OnIt">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#FFF8F1; --card:#FFFFFF; --ink:#2B2340; --ink2:#6F6787; --ink3:#A59EB8;
  --line:#EFE7DF; --line2:#F6F0EA; --accent:#7B5CFA; --accent2:#FF6FA3; --accentSoft:#EFEAFF;
  --warn:#F59F00; --warnSoft:#FFF4D6; --danger:#E03E52;
  --h:48px; --gut:38px; --r:18px;
  --shadow:0 6px 24px rgba(60,40,110,.10); --shadow2:0 2px 8px rgba(60,40,110,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Rubik,Arial,sans-serif;font-size:15px;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);-webkit-user-select:text;user-select:text}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- header ---------- */
.top{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(135deg,#FFE9F1 0%,#EEE8FF 55%,#E3F3FF 100%);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:8px}
.title{flex:1;font-size:21px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{font-size:14px;font-weight:600;color:var(--ink2);margin-inline-start:6px}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.75);box-shadow:var(--shadow2);font-size:18px}
.ibtn svg{width:20px;height:20px}
.pill{height:34px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:var(--shadow2);font-weight:700;font-size:14px}
.row2{display:flex;align-items:center;gap:10px;margin-top:10px}
.seg{display:flex;background:rgba(255,255,255,.7);border-radius:12px;padding:3px;box-shadow:var(--shadow2)}
.seg button{padding:6px 16px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(123,92,250,.35)}
.nav{margin-inline-start:auto;display:flex;gap:6px}
.nav .ibtn{width:34px;height:34px;font-size:20px;font-weight:700}
#syncIco{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
#syncIco.ok{background:#E6F8EE;color:#1E8E5A}
#syncIco.wait{background:#FFF4D6;color:#A86400}
#syncIco.err{background:#FFE3E6;color:var(--danger)}
#syncIco.off{display:none}

/* ---------- banners ---------- */
.banner{margin:8px 12px 0;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow2);display:flex;gap:10px;align-items:center;font-size:13.5px;line-height:1.4}
.banner b{display:block}
.banner .x{margin-inline-start:auto;font-size:18px;color:var(--ink3);padding:4px}
.banner .act{background:var(--accent);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;white-space:nowrap}

/* ---------- calendar ---------- */
#cal{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.cols-head,.allday{display:grid;grid-template-columns:var(--gut) repeat(var(--n),1fr);background:var(--card)}
.cols-head{border-bottom:1px solid var(--line)}
.dh{text-align:center;padding:6px 0 5px;position:relative;cursor:pointer}
.dh .dn{font-size:11.5px;color:var(--ink2);font-weight:600}
.dh .dd{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:15px;margin-top:1px}
.dh.today .dd{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.dh.sat .dn{color:var(--accent)}
.dh .dot{position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent2)}
.cols-head.single .dh{display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:8px 12px;cursor:default}
.cols-head.single .dn{font-size:15px;color:var(--ink)}
.allday{border-bottom:1px solid var(--line);max-height:30vh;overflow-y:auto}
.allday:empty,.allday.empty{display:none}
.adc{padding:3px 2px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.chip{font-size:10.5px;line-height:1.25;padding:2px 4px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.single .chip,.allday.single .chip{font-size:13px;padding:4px 8px;border-radius:8px}
.h-c,.h-e{background:#FFE3EC;color:#C2255C}
.h-m{background:#E9ECF2;color:#495067}
.h-n{background:#E2EEFF;color:#1C5FD0}
.h-f{background:#F3EEE8;color:#7A6A58}
.h-o{background:#FFF1D4;color:#9A5B00}
.chip.ev-ad{color:#fff}

.scroller{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;position:relative;background:var(--card)}
.grid{position:relative;display:grid;grid-template-columns:var(--gut) repeat(var(--n),1fr);height:calc(var(--h) * 24 + 90px)}
.gut{position:relative}
.gut span{position:absolute;inset-inline:0;text-align:center;font-size:10.5px;color:var(--ink3);font-weight:600;transform:translateY(-50%);font-variant-numeric:tabular-nums}
.grid.dense .gut span.odd{display:none}
.col{position:relative;border-inline-start:1px solid var(--line2);
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--h))}
.col.sat{background-color:#FBF9FF}
.col.hol{background-color:#FFF7FA}
.col.today{background-color:#FAF8FF}
.nowline{position:absolute;inset-inline:0;height:2px;background:var(--accent2);z-index:5;pointer-events:none}
.nowline::before{content:"";position:absolute;inset-inline-start:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent2)}
.ev{position:absolute;top:calc(var(--h) * var(--s));height:calc(var(--h) * var(--d) - 2px);min-height:15px;
  right:calc(var(--l) * 100% + 1px);width:calc(var(--w) * 100% - 2px);
  border-radius:7px;padding:2px 4px;overflow:hidden;z-index:2;cursor:pointer;
  background:var(--cs);border-inline-start:3px solid var(--c);color:var(--ct);box-shadow:0 0 0 1px #fff,0 1px 3px rgba(0,0,0,.06)}
.ev .t{font-weight:700;font-size:11px;line-height:1.2;overflow-wrap:normal;word-break:normal}
.ev .tm{font-size:10px;opacity:.8;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.single .ev{padding:4px 8px;border-radius:10px}
.single .ev .t{font-size:14px}
.single .ev .tm{font-size:12px}
.ev .meta{font-size:11px;opacity:.85;margin-top:2px}
.ev .wa{position:absolute;top:1px;left:2px;font-size:10px}
.ev.short .tm{display:none}

.fab{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;z-index:20;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:32px;font-weight:300;box-shadow:0 8px 22px rgba(123,92,250,.45);display:grid;place-items:center}
.todobar{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;height:50px;padding:0 18px;border-radius:18px;background:#fff;box-shadow:var(--shadow);font-weight:800;display:flex;align-items:center;gap:8px}
.todobar .cnt{background:var(--accentSoft);color:var(--accent);border-radius:999px;padding:2px 9px;font-size:13px}
.zoomhint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(43,35,64,.85);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s}
.zoomhint.on{opacity:1}

/* ---------- sheets ---------- */
.ov{position:fixed;inset:0;background:rgba(30,20,60,.32);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.ov.on{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(30,20,60,.18)}
.ov.on .sheet{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;position:relative}
.sh-head::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;border-radius:3px;background:#DDD3E8;margin-left:-20px}
.sh-head h2{flex:1;margin:14px 0 0;font-size:19px;font-weight:800}
.sh-head .ibtn{margin-top:14px}
.sh-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow2)}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 2px 6px}
.field{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none}
.field:focus{border-color:var(--accent)}
.bigtitle{font-size:20px;font-weight:700;border:0;padding:4px 2px;width:100%;outline:none;background:transparent}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1;min-width:0}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.cat i{width:12px;height:12px;border-radius:50%;background:var(--c);display:block}
.cat.on{background:var(--c);border-color:var(--c);color:#fff}
.cat.on i{background:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-weight:600}
.sw{width:50px;height:30px;border-radius:15px;background:#E2DCEA;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:right .2s}
.sw.on{background:var(--accent)}
.sw.on::after{right:23px}
.segs{display:flex;background:#F1ECF7;border-radius:12px;padding:3px}
.segs button{flex:1;padding:8px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink2)}
.segs button.on{background:#fff;color:var(--accent);box-shadow:var(--shadow2)}
.warnbox{background:var(--warnSoft);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:#7A4B00;margin-bottom:12px}
.warnbox b{color:#5C3800}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;height:50px;border-radius:15px;font-weight:800;font-size:16px;background:#fff;box-shadow:var(--shadow2)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(123,92,250,.35)}
.btn.del{color:var(--danger)}
.btn.sm{height:42px;font-size:14.5px}
.hint{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.45}
.recur{font-size:13px;background:var(--accentSoft);color:var(--accent);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-weight:600}

/* todos */
.tsec{background:var(--card);border-radius:var(--r);padding:10px 12px 6px;margin-bottom:12px;box-shadow:var(--shadow2)}
.tsec h3{margin:2px 2px 6px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.tsec h3 i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));display:block}
.tsec h3 small{color:var(--ink2);font-weight:600;font-size:12.5px}
.td{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--line2)}
.td:last-of-type{border-bottom:0}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid #D3C9E3;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900}
.td.done .ck{background:#3CC48A;border-color:#3CC48A}
.td input{flex:1;border:0;outline:none;padding:7px 2px;background:transparent;min-width:0}
.td.done input{text-decoration:line-through;color:var(--ink3)}
.td .rm{color:var(--ink3);font-size:18px;padding:4px 6px}
.add{display:flex;align-items:center;gap:8px;padding:4px 0}
.add span{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--accent);font-size:20px;font-weight:700}
.add input{flex:1;border:0;outline:none;padding:8px 2px;background:transparent}
.empty-note{color:var(--ink3);font-size:13.5px;text-align:center;padding:10px}

/* settings */
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line2);cursor:pointer}
.li:last-child{border-bottom:0}
.li i.d{width:22px;height:22px;border-radius:8px;background:var(--c);flex:none}
.li .nm{flex:1;font-weight:700}
.li .sub{font-size:12px;color:var(--ink2);font-weight:500}
.li .chev{color:var(--ink3)}
.sw-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.swatch{aspect-ratio:1;border-radius:12px;background:var(--c);position:relative}
.swatch.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}

/* dialog */
.dlg-ov{position:fixed;inset:0;background:rgba(30,20,60,.4);z-index:200;display:grid;place-items:center;padding:24px}
.dlg{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 14px;color:var(--ink2);line-height:1.5;font-size:14.5px;white-space:pre-line}
.dlg .btn{width:100%;margin-top:8px;flex:none;display:block}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(43,35,64,.92);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:300;max-width:88vw;text-align:center}

/* ---------- transitions ---------- */
@keyframes inL{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inZ{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.in-l{animation:inL .3s cubic-bezier(.2,.8,.2,1)}
.in-r{animation:inR .3s cubic-bezier(.2,.8,.2,1)}
.in-z{animation:inZ .26s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.in-l,.in-r,.in-z{animation:none}}

/* ---------- multi-day & drag ---------- */
.ev.cont-top{border-top-left-radius:0;border-top-right-radius:0}
.ev.cont-bot{border-bottom-left-radius:0;border-bottom-right-radius:0}
.chip.cont{opacity:.85}
.ev.ghost{background:rgba(123,92,250,.18);border:2px dashed var(--accent);border-inline-start:2px dashed var(--accent);color:var(--accent);pointer-events:none;box-shadow:0 4px 14px rgba(123,92,250,.25)}

/* ---------- month view ---------- */
.month{flex:1;display:flex;flex-direction:column;background:var(--card);min-height:0;overflow:hidden}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.mhead div{text-align:center;font-size:11.5px;color:var(--ink2);font-weight:700;padding:7px 0}
.mhead div.sat{color:var(--accent)}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);min-height:0}
.mc{border-inline-start:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:3px 2px 2px;overflow:hidden;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;position:relative}
.mc.sat{background:#FBF9FF}
.mc.hol{background:#FFF5F8}
.mc.out{background:#FAF7F3}
.mc.out .mn,.mc.out .mb,.mc.out .mh{opacity:.45}
.mc .mn{font-size:12.5px;font-weight:800;width:23px;height:23px;line-height:23px;text-align:center;border-radius:50%;margin:0 auto 1px;flex:none}
.mc.today .mn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.mh{font-size:9.5px;font-weight:700;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.mb{font-size:10px;line-height:1.4;padding:0 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;background:var(--cs);color:var(--ct);flex:none}
.mb.ad{background:var(--c);color:#fff}
.mmore{font-size:9.5px;color:var(--ink2);text-align:center;font-weight:800;flex:none}
.mdot{position:absolute;top:5px;left:4px;width:5px;height:5px;border-radius:50%;background:var(--accent2)}

/* ---------- recurrence editor ---------- */
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.quick button{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink2)}
.quick button.on{border-color:var(--accent);color:var(--accent);background:var(--accentSoft)}
.cyc{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:4px}
.cyc b{min-width:22px;text-align:center;font-size:18px}
.stp{width:34px;height:34px;border-radius:11px;background:#F1ECF7;font-size:20px;font-weight:800;color:var(--accent)}
.wkrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2)}
.wkrow:last-child{border-bottom:0}
.wkl{width:62px;flex:none;font-weight:700;font-size:13px;line-height:1.2}
.wkl small{display:block;text-align:right;font-weight:500;color:var(--ink3);font-size:10.5px}
.wkd{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dchip{aspect-ratio:1;max-width:38px;width:100%;margin:0 auto;border-radius:50%;background:#F4F0F8;font-weight:800;font-size:12.5px;color:var(--ink2);position:relative}
.dchip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 8px rgba(123,92,250,.3)}
.dchip.start::after{content:"";position:absolute;bottom:-4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.recsum{margin-top:10px;background:var(--accentSoft);color:#4B32B8;border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.5}
.seg button{padding:6px 13px}

/* ---------- location & clashes ---------- */
.locrow{display:flex;gap:8px;align-items:center}
.locrow .field{flex:1}
.navbtn{width:46px;height:46px;flex:none;border-radius:13px;background:var(--accentSoft);font-size:21px}
.warnbox.clash{background:#FFE9EC;color:#8A1F33}
.warnbox.clash b{color:#6B1426}
.locres{margin-top:8px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line)}
.locres button{display:block;width:100%;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line2);background:#fff;font-size:14.5px}
.locres button small{display:block;color:var(--ink2);font-size:12px}
.locres button:last-child{border-bottom:0}

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row1">
      <div class="title" id="title"></div>

function todoListHTML(list, kind) {
  return list.map((t, i) => `<div class="td ${t.done ? 'done' : ''}" data-i="${i}"><button class="ck" data-a="ck">${t.done ? '✓' : ''}</button><input value="${esc(t.text)}" data-a="ed" enterkeyhint="done"><button class="rm" data-a="rm">✕</button></div>`).join('')
    + `<div class="add"><span>+</span><input placeholder="${kind === 'ev' ? 'להוסיף משימה לאירוע…' : 'להוסיף משימה…'}" data-a="add" enterkeyhint="enter"></div>`;
}
function bindTodoList(root, get, set) {
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    const row = a.closest('.td'); const list = get();
    if (a.dataset.a === 'ck') { list[+row.dataset.i].done = !list[+row.dataset.i].done; set(list); }
    if (a.dataset.a === 'rm') { list.splice(+row.dataset.i, 1); set(list); }
  });
  const commitAdd = inp => {
    const v = inp.value.trim(); if (!v) return false;
    inp.value = ''; const list = get(); list.push({ id: uid(), text: v, done: false }); set(list);
    const n = root.querySelector('input[data-a="add"]'); n && n.focus(); return true;
  };
  root.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (e.target.dataset.a === 'add') { e.preventDefault(); commitAdd(e.target); }
    if (e.target.dataset.a === 'ed') { e.preventDefault(); e.target.blur(); }
  });
  root.addEventListener('focusout', e => {
    if (e.target.dataset.a === 'add') { if (e.target.value.trim()) setTimeout(() => commitAdd(e.target), 0); }
    if (e.target.dataset.a === 'ed') {
      const row = e.target.closest('.td'), list = get(), i = +row.dataset.i, v = e.target.value.trim();
      if (!list[i] || list[i].text === v) return;
      if (v) list[i].text = v; else list.splice(i, 1);
      set(list);
    }
  });
}

  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importFile(f) {

/* ============================================================
   GOOGLE SYNC (Apps Script בחשבון שלה)
   ============================================================ */
function parseCode(s) {
  const m = String(s || '').trim().match(/^(https:\/\/script\.google(?:usercontent)?\.com\/\S+?)#k=([A-Za-z0-9]+)$/);
  return m ? { url: m[1], k: m[2] } : null;
}
const syncCode = () => parseCode(S.settings.sync);
async function call(body) {
  const c = syncCode(); if (!c) return { ok: false, error: 'אין קוד חיבור' };
  if (!navigator.onLine) return { ok: false, error: 'אין חיבור לאינטרנט' };
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 25000);
    const r = await fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, k: c.k }), signal: ctl.signal, redirect: 'follow' });
    clearTimeout(to);
    const j = await r.json(); return j;
  } catch (e) { return { ok: false, error: e.name === 'AbortError' ? 'לא היתה תשובה' : 'בעיית תקשורת' }; }
}
let syncTimer, syncing = false;
function scheduleSync() { updSync(); if (!syncCode()) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 2500); }
async function sync(force) {
  if (!syncCode() || syncing) return;
  if (!M.dirty && !force) return;
  if (!M.lastSync && !S.events.length && !Object.keys(S.dayTodos).length) return; // מכשיר חדש וריק לא ידרוס גיבוי
  if (!navigator.onLine) { updSync(); return; }
  syncing = true; updSync();
  const r = await call({ action: 'save', data: S, reminders: buildReminders() });
  syncing = false;
  if (r.ok) { M.dirty = false; M.lastSync = Date.now(); M.err = ''; } else M.err = r.error || 'שגיאה';
  saveMeta(); updSync();
}
async function restore() {
  toast('משחזר…');
  const r = await call({ action: 'load' });
  if (!r.ok) return toast('השחזור נכשל: ' + r.error, 3500);
  if (!r.data) return toast('עוד אין גיבוי בגוגל');
  const code = S.settings.sync; S = migrate(r.data); S.settings = S.settings || {}; S.settings.sync = code;
  localStorage.setItem(KEY, JSON.stringify(S)); M.dirty = false; M.lastSync = Date.now(); saveMeta();
  closeSheet(); render(); updSync(); toast('שוחזר ✓');
}
function syncState() {
  if (!syncCode()) return { cls: 'off', icon: '⚪', text: 'לא מחובר – המידע נשמר רק בטלפון' };
  if (syncing) return { cls: 'wait', icon: '⏳', text: 'מסנכרן…' };
  if (M.dirty && !navigator.onLine) return { cls: 'wait', icon: '⏳', text: 'ממתין לקליטה – יסונכרן אוטומטית' };
  if (M.err && M.dirty) return { cls: 'err', icon: '⚠️', text: 'הסנכרון נכשל: ' + M.err };
  if (M.dirty) return { cls: 'wait', icon: '⏳', text: 'ממתין לסנכרון' };
  return { cls: 'ok', icon: '✓', text: 'מגובה בגוגל' + (M.lastSync ? ' · ' + new Date(M.lastSync).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '') };
}
function updSync() {
  const s = syncState(), el = $('#syncIco'); if (!el) return;
  el.className = s.cls; el.textContent = s.cls === 'ok' ? '☁︎ ✓' : s.cls === 'wait' ? '☁︎ ⏳' : s.cls === 'err' ? '☁︎ ⚠️' : '';
  el.title = s.text;
}
function buildReminders() {
  const now = Date.now(), from = addDays(today(), -1), to = addDays(today(), 120), out = [];
  for (const e of S.events) {
    if (e.rem == null || e.rem < 0) continue;
    const c = cat(e.cat);
    for (const d of occurrences(e, from, to)) {
      const [y, m, dd] = d.split('-').map(Number), st = e.allDay ? 8 * 60 : toMin(e.start);
      const start = new Date(y, m - 1, dd, Math.floor(st / 60), st % 60).getTime();
      const at = start - e.rem * 60000;
      if (at < now - 60000) continue;
      const endD = addDays(d, e.span || 0);
      const when = (e.allDay ? (e.span ? 'עד ' + longDate(endD) : 'כל היום') : e.start + '–' + e.end + (e.span ? ' (' + longDate(endD) + ')' : '')) + ' · ' + longDate(d);
      const tds = (S.evTodos[tkey(e.id, d)] || []).filter(t => !t.done).map(t => t.text);
      const subj = '⏰ ' + (e.title || 'אירוע') + (e.allDay ? ' – היום' : ' – ' + e.start);
      const txt = [when, 'קטגוריה: ' + c.name, e.loc ? 'מיקום: ' + e.loc + '\nWaze: ' + navUrl('waze', e.loc, e.ll) + '\nGoogle Maps: ' + navUrl('gmaps', e.loc, e.ll) : '', e.notes ? 'הערות: ' + e.notes : '', tds.length ? 'משימות:\n• ' + tds.join('\n• ') : ''].filter(Boolean).join('\n');
      const html = `<div dir="rtl" style="font-family:Arial,sans-serif;font-size:15px;color:#2B2340"><div style="border-right:5px solid ${c.color};padding:6px 12px;background:${tint(c.color, .15)};border-radius:8px"><div style="font-size:18px;font-weight:bold">${esc(e.title || 'אירוע')}</div><div>${esc(when)}</div><div style="color:#6F6787">${esc(c.name)}</div></div>${e.loc ? `<p>📍 ${esc(e.loc)}<br><a href="${navUrl('waze', e.loc, e.ll)}">ניווט ב-Waze</a> · <a href="${navUrl('gmaps', e.loc, e.ll)}">Google Maps</a> · <a href="${navUrl('apple', e.loc, e.ll)}">מפות Apple</a></p>` : ''}${e.notes ? `<p>${esc(e.notes).replace(/\n/g, '<br>')}</p>` : ''}${tds.length ? `<p><b>משימות:</b><br>${tds.map(t => '☐ ' + esc(t)).join('<br>')}</p>` : ''}</div>`;
      out.push({ id: [e.id, d, e.start, e.rem, e.allDay ? 1 : 0].join('|'), at, n: senderName(), s: subj, b: txt, h: html });
    }
  }
  return out.sort((a, b) => a.at - b.at).slice(0, 1500);
}

/* ============================================================
   BANNERS (התקנה / גיבוי שבועי)
   ============================================================ */
function hideBanner() { const b = $('#banner'); if (b) b.innerHTML = ''; }
function banners() {
  const b = $('#banner'); b.innerHTML = '';
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (ios && !standalone && !sessionStorage.getItem('luz-noinst')) {
    b.innerHTML = `<div class="banner"><span style="font-size:22px">📲</span><div><b>להתקנה במסך הבית</b>לוחצים על כפתור השיתוף ⬆︎ ואז "הוספה למסך הבית". חשוב להתקין לפני שמכניסים מידע.</div><button class="x" id="bx">✕</button></div>`;
    $('#bx').onclick = () => { sessionStorage.setItem('luz-noinst', 1); hideBanner(); requestAnimationFrame(() => { resetZoom('now'); if (view === 'month') render(); }); };
    return;
  }
  if (!syncCode() && S.events.length && Date.now() - (M.lastBackup || M.firstUse || 0) > 7 * 864e5) {
    b.innerHTML = `<div class="banner"><span style="font-size:22px">💾</span><div><b>הגיע זמן לגבות</b>שבוע מאז הגיבוי האחרון.</div><button class="act" id="bb">גיבוי</button><button class="x" id="bx">✕</button></div>`;
    $('#bb').onclick = exportFile; $('#bx').onclick = () => { M.lastBackup = Date.now() - 6 * 864e5; saveMeta(); hideBanner(); };
  }
}

/* ============================================================
   WELCOME
   ============================================================ */
function welcome() {
  if (M.welcomed) return;
  M.welcomed = 1; M.firstUse = Date.now(); saveMeta();
  openSheet('ברוכה הבאה ל-OnIt 💜', `
    <div class="card"><div class="lbl">איך קוראים לך?</div>
      <input class="field" id="w-name" maxlength="30" placeholder="השם שלך" value="${esc(S.settings.name || '')}" enterkeyhint="done">
      <div class="hint">ככה יגיעו התזכורות במייל: <b id="w-prev" dir="ltr" style="unicode-bidi:isolate">Be OnIt!</b></div></div>
    <div class="card" style="line-height:1.75">
      ➕ <b>אירוע חדש</b> – הכפתור הצבעוני, נגיעה בשעה ריקה, או לחיצה ארוכה וגרירה<br>
      🤏 <b>צביטה</b> – לראות יותר או פחות שעות במסך<br>
      👆 <b>החלקה לצדדים</b> – לחודש, לשבוע או ליום הבא<br>
      📅 <b>נגיעה ביום</b> – תצוגת יום עם המשימות שלו<br>
      🔁 <b>אירועים חוזרים</b> – כל שבוע, כל כמה שבועות, או סירוגין בין ימים<br>
      🎨 <b>קטגוריות וצבעים</b> – בהגדרות ⚙
    </div>
    <div class="btns"><button class="btn pri" id="w-go">יאללה, מתחילות</button></div>`, sh => {
    const inp = $('#w-name', sh), prev = () => $('#w-prev', sh).textContent = inp.value.trim() ? 'Be OnIt, ' + inp.value.trim() + '‎!' : 'Be OnIt!';
    inp.oninput = prev; prev();
    inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
    $('#w-go', sh).onclick = () => { const v = inp.value.trim(); if (v) { S.settings.name = v; save(); } closeSheet(); };
  });
}

/* ============================================================
   INIT
   ============================================================ */
function setView(v) {
  const was = view; view = v; localStorage.setItem('luz-view', v);
  render(was !== v ? 'z' : null);
  resetZoom(cur === today() || (v === 'week' && weekStart(cur) === weekStart(today())) ? 'now' : 8);
}
function init() {
  $$('.seg button').forEach(b => b.onclick = () => setView(b.dataset.v));
  $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
  $('#btnToday').onclick = () => { const dir = today() > cur ? 1 : today() < cur ? -1 : 0; cur = today(); render(dir ? (dir > 0 ? 'l' : 'r') : null); resetZoom('now'); };
  $('#btnSet').onclick = openSettings;
  $('#syncIco').onclick = () => toast(syncState().text, 3000);
  $('#fab').onclick = () => {
    if (view === 'day') return newEvent(cur);
    if (view === 'month') return newEvent(monthStart(cur) === monthStart(today()) ? today() : monthStart(cur));
    newEvent(weekStart(cur) === weekStart(today()) ? today() : weekStart(cur));
  };
  $('#todobar').onclick = () => openTodoSheet(cur);
  $('#heads').addEventListener('click', e => { const h = e.target.closest('[data-d]'); if (h) { cur = h.dataset.d; setView('day'); } });
  $('#allday').addEventListener('click', e => {
    const evc = e.target.closest('[data-ev]');
    if (evc) return openEditor(S.events.find(x => x.id === evc.dataset.ev), evc.dataset.d);
    const c = e.target.closest('.adc[data-d]'); if (c && c.children.length) openDayInfo(c.dataset.d);
  });
  $('#grid').addEventListener('click', e => {
    if (Date.now() - suppressClick < 500) return;
    const ev = e.target.closest('.ev:not(.ghost)');
    if (ev) return openEditor(S.events.find(x => x.id === ev.dataset.ev), ev.dataset.d);
    const col = e.target.closest('.col'); if (!col) return;
    const y = e.clientY - col.getBoundingClientRect().top;
    newEvent(col.dataset.d, Math.min(23 * 60, Math.max(0, Math.floor(y / hourH * 2) * 30)));
  });
  $('#month').addEventListener('click', e => {
    if (Date.now() - suppressClick < 500) return;
    const c = e.target.closest('.mc[data-d]'); if (!c) return;
    cur = c.dataset.d; setView('day');
  });
  window.addEventListener('online', () => { updSync(); sync(); });
  window.addEventListener('offline', updSync);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (M.dirty) sync(); if (today() !== lastDay) { lastDay = today(); cur = today(); render(); } } });
  window.addEventListener('resize', () => { bounds(); setH(hourH); if (view === 'month') render(); });
  initGestures();
  render(); banners(); resetZoom('now'); updSync();
  if (syncCode() && (M.dirty || Date.now() - (M.lastSync || 0) > 20 * 3600e3)) sync(true);
  welcome();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();

</script>
